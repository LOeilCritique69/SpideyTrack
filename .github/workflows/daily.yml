name: SpideyTrack — Daily Guess

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-guess:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests
          playwright install chromium
          playwright install-deps chromium

      - name: Run daily guess
        run: python Marveldle/tweet.py

      - name: Commit & push results
        run: |
          git config user.name  "SpideyTrack Bot"
          git config user.email "bot@spideytrack.com"
          git add Marveldle/marveldle/results.json
          git add Marveldle/marveldle/results_andrew.json
          git add Marveldle/marveldle/results_tobey.json
          git add Marveldle/marveldle/images/
          git add Marveldle/marveldle/images_andrew/
          git add Marveldle/marveldle/images_tobey/
          git add Marveldle/day.txt
          git add Marveldle/day-andrew.txt
          git add Marveldle/day_tobey.txt
          git diff --staged --quiet || git commit -m "Day $(cat Marveldle/day.txt) — $(date '+%Y-%m-%d')"
          git push -f origin main
